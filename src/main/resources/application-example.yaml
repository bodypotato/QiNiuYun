spring:
  application:
    name: AIScript
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

# ==================== DeepSeek API 配置 ====================
# 使用说明：
#   1. 复制本文件，重命名为 application.yaml
#   2. 将下面 "你的API密钥" 替换为你的 DeepSeek API Key
#   3. 前往 https://platform.deepseek.com 注册并获取密钥
deepseek:
  api:
    url: https://api.deepseek.com
    key: 你的API密钥
    model: deepseek-chat
    connect-timeout-ms: 30000
    read-timeout-ms: 180000   # 3分钟——长文本转换需要更长时间

# ==================== 日志 ====================
logging:
  level:
    com.body.aiscript: DEBUG
    org.springframework.web: INFO
