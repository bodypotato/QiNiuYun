spring:
  application:
    name: AIScript
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

# ==================== DeepSeek API 配置 ====================
# 使用说明：
#   方式一（推荐）：设置环境变量 DEEPSEEK_API_KEY，无需修改本文件
#   方式二：复制本文件为 application.yaml，替换下面的占位符
#   获取密钥：https://platform.deepseek.com
deepseek:
  api:
    url: https://api.deepseek.com
    key: ${DEEPSEEK_API_KEY:}
    model: deepseek-chat
    connect-timeout-ms: 30000
    read-timeout-ms: 180000   # 3分钟——长文本转换需要更长时间

# ==================== 日志 ====================
logging:
  level:
    com.body.aiscript: DEBUG
    org.springframework.web: INFO
