<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Script · 小说转剧本</title>
    <style>
        :root {
            --bg: #f7f4ef;
            --card: #ffffff;
            --text: #3d3929;
            --sub: #8b8576;
            --accent: #7b9e8f;
            --accent-hover: #628f7e;
            --border: #e6e0d3;
            --tag-bg: #f0ede3;
            --input-bg: #fcfbf7;
            --danger: #c4877b;
            --danger-hover: #b0756a;
            --shadow: 0 2px 12px rgba(60, 50, 30, 0.06);
            --code-bg: #2c2923;
            --code-text: #e8e3d3;
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 22px;
            --action-color: #5b8cbd;
            --dialogue-color: #6b9e7a;
            --transition-color: #9b7ec4;
            --note-color: #c49b5e;
        }

        [data-theme="dark"] {
            --bg: #1b1a16;
            --card: #262420;
            --text: #e0dccf;
            --sub: #9b9683;
            --accent: #8bae9e;
            --accent-hover: #7a9f8e;
            --border: #3d3a32;
            --tag-bg: #322f28;
            --input-bg: #22201b;
            --danger: #d49589;
            --danger-hover: #c08075;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            --code-bg: #1e1c18;
            --code-text: #d4cfbe;
            --action-color: #7aaddb;
            --dialogue-color: #82b591;
            --transition-color: #b398d8;
            --note-color: #d4ae74;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ─── Header ─── */
        .header {
            text-align: center;
            padding: 48px 24px 32px;
            position: relative;
        }
        .header .icon { font-size: 44px; margin-bottom: 8px; }
        .header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
        .header p { color: var(--sub); font-size: 15px; margin-top: 6px; }

        .theme-toggle {
            position: absolute; top: 12px; right: 24px;
            width: 40px; height: 40px; border-radius: 50%;
            border: 1.5px solid var(--border); background: var(--card);
            font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease; line-height: 1;
        }
        .theme-toggle:hover { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123, 158, 143, 0.12); }

        /* ─── Layout ─── */
        .container {
            max-width: 960px; margin: 0 auto; padding: 0 24px 60px;
            display: flex; flex-direction: column; gap: 20px;
        }

        /* ─── Card ─── */
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 28px 30px; box-shadow: var(--shadow);
        }

        /* ─── Mode Tabs ─── */
        .tabs {
            display: flex; gap: 6px; background: var(--tag-bg);
            border-radius: var(--radius-lg); padding: 5px; margin-bottom: 24px;
        }
        .tab {
            flex: 1; padding: 10px 0; text-align: center;
            border-radius: calc(var(--radius-lg) - 4px); cursor: pointer;
            font-size: 14px; font-weight: 500; color: var(--sub);
            border: none; background: transparent; transition: all 0.2s ease;
        }
        .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }

        /* ─── Form ─── */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-row.single { grid-template-columns: 1fr; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label { font-size: 13px; font-weight: 600; color: var(--sub); letter-spacing: 0.3px; }
        .field input, .field textarea, .field select {
            width: 100%; padding: 11px 15px; border: 1.5px solid var(--border);
            border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
            color: var(--text); background: var(--input-bg); outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease; resize: vertical;
        }
        .field input:focus, .field textarea:focus, .field select:focus {
            border-color: var(--accent); box-shadow: 0 0 0 3px rgba(123, 158, 143, 0.12);
        }
        .field textarea { min-height: 280px; font-size: 13px; line-height: 1.8; }
        .field .hint { font-size: 11px; color: var(--sub); }

        /* ─── Upload Zone ─── */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: var(--radius);
            padding: 52px 24px; text-align: center; cursor: pointer;
            transition: all 0.2s ease; background: var(--input-bg);
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--accent); background: rgba(123, 158, 143, 0.04); }
        .upload-zone .upload-icon { font-size: 42px; margin-bottom: 10px; }
        .upload-zone .upload-text { font-size: 15px; color: var(--text); font-weight: 500; }
        .upload-zone .upload-hint { font-size: 12px; color: var(--sub); margin-top: 4px; }
        .upload-zone input[type="file"] { display: none; }
        .file-name {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 14px; background: var(--tag-bg);
            border-radius: var(--radius-lg); font-size: 13px; margin-top: 12px;
        }
        .file-name .remove { cursor: pointer; color: var(--danger); font-weight: 700; font-size: 16px; line-height: 1; }

        /* ─── Buttons ─── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 7px;
            padding: 12px 28px; border: none; border-radius: var(--radius-lg);
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; font-family: inherit;
        }
        .btn-primary {
            width: 100%; background: var(--accent); color: #fff;
            padding: 14px; font-size: 16px; letter-spacing: 0.5px;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-ghost { background: var(--tag-bg); color: var(--text); font-size: 13px; padding: 8px 18px; }
        .btn-ghost:hover { background: var(--border); }
        .btn-sm { font-size: 13px; padding: 7px 16px; border-radius: var(--radius-sm); }
        .btn-danger { background: var(--danger); color: #fff; font-size: 13px; padding: 7px 14px; }
        .btn-danger:hover { background: var(--danger-hover); }
        .btn-icon {
            width: 32px; height: 32px; padding: 0; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--border); background: var(--card);
            cursor: pointer; font-size: 16px; transition: all 0.15s ease;
        }
        .btn-icon:hover { border-color: var(--accent); background: var(--tag-bg); }
        .btn-icon.danger:hover { border-color: var(--danger); color: var(--danger); }

        /* ─── Editor Toolbar ─── */
        .editor-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 12px; margin-bottom: 20px;
            padding-bottom: 16px; border-bottom: 1px solid var(--border);
        }
        .editor-title-input {
            font-size: 20px; font-weight: 700; border: none; background: transparent;
            color: var(--text); padding: 4px 8px; border-radius: 6px;
            min-width: 200px; flex: 1; outline: none; font-family: inherit;
        }
        .editor-title-input:focus { background: var(--input-bg); box-shadow: 0 0 0 2px var(--accent); }
        .editor-actions { display: flex; gap: 8px; align-items: center; }

        /* ─── Editor Tabs ─── */
        .editor-tabs {
            display: flex; gap: 2px; margin-bottom: 24px;
            border-bottom: 2px solid var(--border);
        }
        .editor-tab {
            padding: 10px 20px; cursor: pointer; font-size: 14px; font-weight: 500;
            color: var(--sub); border: none; background: none;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: all 0.2s ease; font-family: inherit;
        }
        .editor-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
        .editor-tab:hover { color: var(--text); }

        .editor-panel { display: none; }
        .editor-panel.active { display: block; }

        /* ─── Meta Editor ─── */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .meta-grid .span-2 { grid-column: 1 / -1; }
        .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .tag-item {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; background: var(--tag-bg); border-radius: 20px;
            font-size: 12px; color: var(--text);
        }
        .tag-item .remove { cursor: pointer; color: var(--danger); font-weight: 700; font-size: 14px; }
        .tag-add { display: flex; gap: 6px; margin-top: 4px; }
        .tag-add input { flex: 1; padding: 6px 10px; font-size: 12px; border-radius: 20px; }

        /* ─── Character Editor ─── */
        .char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
        .char-card {
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            overflow: hidden; transition: all 0.2s ease;
        }
        .char-card.expanded { border-color: var(--accent); }
        .char-card-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; cursor: pointer; user-select: none;
        }
        .char-card-header:hover { background: var(--tag-bg); }
        .char-card-header .char-name { font-weight: 600; font-size: 15px; }
        .char-card-header .char-role-badge {
            font-size: 11px; padding: 3px 10px; border-radius: 12px;
            background: var(--tag-bg); color: var(--sub);
        }
        .char-card-body { display: none; padding: 0 16px 16px; }
        .char-card.expanded .char-card-body { display: block; }
        .char-field { margin-bottom: 10px; }
        .char-field label { font-size: 12px; font-weight: 600; color: var(--sub); display: block; margin-bottom: 3px; }
        .char-field input, .char-field textarea, .char-field select {
            width: 100%; padding: 8px 12px; border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 13px; font-family: inherit;
            color: var(--text); background: var(--input-bg); outline: none;
        }
        .char-field input:focus, .char-field textarea:focus, .char-field select:focus {
            border-color: var(--accent); box-shadow: 0 0 0 2px rgba(123, 158, 143, 0.1);
        }
        .char-field textarea { min-height: 60px; resize: vertical; }
        .add-char-btn {
            width: 100%; padding: 16px; border: 2px dashed var(--border); border-radius: var(--radius-sm);
            text-align: center; cursor: pointer; font-size: 14px; color: var(--sub);
            background: transparent; transition: all 0.2s ease; font-family: inherit;
        }
        .add-char-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(123,158,143,0.04); }

        /* ─── Structure Editor ─── */
        .act-section {
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            margin-bottom: 16px; overflow: hidden;
        }
        .act-header {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px; background: var(--tag-bg); cursor: pointer; user-select: none;
        }
        .act-header:hover { filter: brightness(0.97); }
        .act-header .act-num { font-weight: 700; font-size: 18px; color: var(--accent); }
        .act-header .act-title { font-weight: 600; font-size: 15px; flex: 1; }
        .act-header .act-scene-count { font-size: 12px; color: var(--sub); }
        .act-body { display: none; padding: 16px 18px; }
        .act-section.expanded .act-body { display: block; }

        .scene-card {
            border: 1px solid var(--border); border-radius: 10px;
            margin-bottom: 12px; overflow: hidden;
        }
        .scene-header {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 14px; cursor: pointer; user-select: none;
            transition: background 0.15s ease;
        }
        .scene-header:hover { background: var(--tag-bg); }
        .scene-num { font-weight: 700; color: var(--accent); font-size: 14px; min-width: 50px; }
        .scene-title-text { font-weight: 600; font-size: 14px; flex: 1; }
        .scene-meta-pills { display: flex; gap: 6px; flex-wrap: wrap; }
        .scene-meta-pill {
            font-size: 11px; padding: 2px 8px; border-radius: 10px;
            background: var(--tag-bg); color: var(--sub);
        }
        .scene-body { display: none; padding: 0 14px 14px; }
        .scene-card.expanded .scene-body { display: block; }
        .scene-fields {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-bottom: 14px; padding-top: 8px;
        }
        .scene-fields .sf-full { grid-column: 1 / -1; }
        .scene-fields label { font-size: 11px; font-weight: 600; color: var(--sub); display: block; margin-bottom: 2px; }
        .scene-fields input, .scene-fields textarea {
            width: 100%; padding: 7px 10px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 13px; font-family: inherit;
            color: var(--text); background: var(--input-bg); outline: none;
        }
        .scene-fields input:focus, .scene-fields textarea:focus {
            border-color: var(--accent); box-shadow: 0 0 0 2px rgba(123, 158, 143, 0.1);
        }
        .scene-fields textarea { min-height: 50px; resize: vertical; }

        /* ─── Content Blocks ─── */
        .content-blocks { margin-top: 6px; }
        .content-block {
            border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 8px; overflow: hidden;
            border-left: 4px solid var(--border);
        }
        .content-block.type-action { border-left-color: var(--action-color); }
        .content-block.type-dialogue { border-left-color: var(--dialogue-color); }
        .content-block.type-transition { border-left-color: var(--transition-color); }
        .content-block.type-note { border-left-color: var(--note-color); }
        .cb-header {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; background: var(--tag-bg); font-size: 12px;
        }
        .cb-type-badge {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            padding: 2px 8px; border-radius: 4px; letter-spacing: 0.5px;
        }
        .type-action .cb-type-badge { background: rgba(91,140,189,0.15); color: var(--action-color); }
        .type-dialogue .cb-type-badge { background: rgba(107,158,122,0.15); color: var(--dialogue-color); }
        .type-transition .cb-type-badge { background: rgba(155,126,196,0.15); color: var(--transition-color); }
        .type-note .cb-type-badge { background: rgba(196,155,94,0.15); color: var(--note-color); }
        .cb-char { font-weight: 600; color: var(--text); }
        .cb-actions { margin-left: auto; display: flex; gap: 4px; }
        .cb-body { padding: 10px 12px; }
        .cb-body textarea {
            width: 100%; min-height: 50px; padding: 8px 10px;
            border: 1px solid var(--border); border-radius: 6px;
            font-size: 13px; font-family: inherit; color: var(--text);
            background: var(--input-bg); outline: none; resize: vertical;
        }
        .cb-body textarea:focus { border-color: var(--accent); }
        .cb-dialogue-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .cb-dialogue-fields input, .cb-dialogue-fields select {
            width: 100%; padding: 7px 10px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 13px; font-family: inherit;
            color: var(--text); background: var(--input-bg); outline: none;
        }
        .cb-dialogue-fields input:focus { border-color: var(--accent); }

        .add-content-btn {
            display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px;
        }
        .add-content-btn button {
            font-size: 12px; padding: 6px 12px; border: 1px dashed var(--border);
            border-radius: 20px; cursor: pointer; background: transparent;
            color: var(--sub); transition: all 0.15s ease; font-family: inherit;
        }
        .add-content-btn button:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }

        /* ─── YAML Source Tab ─── */
        .yaml-source {
            background: var(--code-bg); color: var(--code-text);
            border-radius: var(--radius-sm); padding: 18px 20px;
            font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
            font-size: 13px; line-height: 1.7; width: 100%;
            min-height: 400px; border: none; resize: vertical; outline: none;
        }
        .yaml-source:focus { box-shadow: 0 0 0 2px var(--accent); }

        /* ─── Add Scene / Act Buttons ─── */
        .add-scene-btn {
            width: 100%; padding: 12px; border: 2px dashed var(--border); border-radius: 10px;
            text-align: center; cursor: pointer; font-size: 13px; color: var(--sub);
            background: transparent; transition: all 0.2s ease; font-family: inherit;
        }
        .add-scene-btn:hover { border-color: var(--accent); color: var(--accent); }
        .add-act-btn {
            width: 100%; padding: 14px; border: 2px dashed var(--border); border-radius: var(--radius-sm);
            text-align: center; cursor: pointer; font-size: 14px; color: var(--sub);
            background: transparent; margin-top: 8px; transition: all 0.2s ease; font-family: inherit;
        }
        .add-act-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ─── Spinner ─── */
        .spinner {
            display: inline-block; width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,0.3);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Toast ─── */
        .toast {
            position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
            padding: 10px 24px; background: var(--text); color: #fff;
            border-radius: var(--radius-lg); font-size: 14px;
            opacity: 0; transition: opacity 0.25s ease;
            pointer-events: none; z-index: 999;
        }
        .toast.show { opacity: 1; }

        /* ─── Result Meta ─── */
        .result-meta {
            display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
        }
        .result-meta .tag {
            font-size: 12px; padding: 5px 12px; background: var(--tag-bg);
            border-radius: var(--radius-lg); color: var(--sub);
        }

        /* ─── Rewrite Modal ─── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 24px;
        }
        .modal {
            background: var(--card); border-radius: var(--radius);
            max-width: 700px; width: 100%; max-height: 85vh;
            display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px; border-bottom: 1px solid var(--border);
        }
        .modal-header h3 { font-size: 17px; font-weight: 700; }
        .modal-close {
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--card); cursor: pointer; font-size: 18px; display: flex;
            align-items: center; justify-content: center; transition: all 0.15s;
        }
        .modal-close:hover { border-color: var(--danger); color: var(--danger); }
        .modal-body {
            padding: 20px 24px; overflow-y: auto; flex: 1;
            display: flex; flex-direction: column; gap: 16px;
        }
        .modal-section {}
        .modal-section label { font-size: 13px; font-weight: 600; color: var(--sub); display: block; margin-bottom: 6px; }
        .modal-original {
            background: var(--tag-bg); border-radius: 8px; padding: 14px;
            font-size: 13px; line-height: 1.7; color: var(--text);
            max-height: 160px; overflow-y: auto; white-space: pre-wrap;
        }
        .modal-original .type-label {
            font-size: 10px; font-weight: 700; text-transform: uppercase;
            padding: 2px 6px; border-radius: 4px; margin-right: 6px;
            color: var(--accent); background: rgba(123,158,143,0.15);
        }
        .modal-instruction-input {
            width: 100%; padding: 12px; border: 1.5px solid var(--border);
            border-radius: 8px; font-size: 14px; font-family: inherit;
            color: var(--text); background: var(--input-bg); outline: none;
        }
        .modal-instruction-input:focus { border-color: var(--accent); }
        .modal-quick-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .modal-quick-actions button {
            font-size: 12px; padding: 5px 12px; border: 1px solid var(--border);
            border-radius: 16px; cursor: pointer; background: var(--card);
            color: var(--text); transition: all 0.15s; font-family: inherit;
        }
        .modal-quick-actions button:hover { border-color: var(--accent); background: var(--tag-bg); }
        .modal-rewritten {
            background: rgba(123,158,143,0.06); border: 1px solid var(--accent);
            border-radius: 8px; padding: 14px; font-size: 13px;
            line-height: 1.7; color: var(--text); white-space: pre-wrap;
            max-height: 200px; overflow-y: auto;
        }
        .modal-rewrite-btn {
            width: 100%; padding: 12px; background: var(--accent); color: #fff;
            border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: background 0.2s;
        }
        .modal-rewrite-btn:hover { background: var(--accent-hover); }
        .modal-rewrite-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .modal-result-actions { display: flex; gap: 8px; }
        .modal-result-actions button { flex: 1; }
        .modal-suggestion {
            font-size: 12px; color: var(--sub); padding: 8px 12px;
            background: var(--tag-bg); border-radius: 6px; border-left: 3px solid var(--accent);
        }

        /* ─── Hidden ─── */
        .hidden { display: none !important; }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .meta-grid { grid-template-columns: 1fr; }
            .char-grid { grid-template-columns: 1fr; }
            .scene-fields { grid-template-columns: 1fr 1fr; }
            .editor-toolbar { flex-direction: column; align-items: stretch; }
            .editor-tabs { overflow-x: auto; }
        }
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr; }
            .header { padding: 32px 16px 20px; }
            .header h1 { font-size: 24px; }
            .card { padding: 20px 18px; }
            .scene-fields { grid-template-columns: 1fr; }
            .cb-dialogue-fields { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <button class="theme-toggle" id="themeToggle" title="切换深色/浅色模式">🌙</button>
    <div class="icon">🎬</div>
    <h1>AI Script</h1>
    <p>将小说自动转换为结构化 YAML 剧本，在线编辑打磨</p>
</div>

<div class="container">

    <!-- ── Input Card (保持不变) ── -->
    <div class="card" id="inputCard">
        <div class="tabs">
            <button class="tab active" data-mode="text">📝 粘贴文本</button>
            <button class="tab" data-mode="file">📂 上传 TXT</button>
        </div>

        <div id="textMode">
            <div class="form-row single">
                <div class="field">
                    <label>小说正文</label>
                    <textarea id="contentInput" placeholder="在此粘贴小说正文（3~6章，100~50000字）…"></textarea>
                    <span class="hint" id="wordCount">0 / 50000 字</span>
                </div>
            </div>
        </div>

        <div id="fileMode" class="hidden">
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📄</div>
                <div class="upload-text">点击选择 .txt 文件 或拖拽到此处</div>
                <div class="upload-hint">支持 UTF-8 编码，最多 50000 字 / 6 章</div>
                <input type="file" id="fileInput" accept=".txt,text/plain">
            </div>
            <div id="fileInfo" class="hidden" style="text-align:center;">
                <span class="file-name">
                    📎 <span id="fileName"></span>
                    <span class="remove" id="removeFile">×</span>
                </span>
            </div>
        </div>

        <div class="form-row" style="margin-top:16px;">
            <div class="field">
                <label>标题（选填）</label>
                <input type="text" id="titleInput" placeholder="自动识别或手动输入">
            </div>
            <div class="field">
                <label>作者（选填）</label>
                <input type="text" id="authorInput" placeholder="自动识别或手动输入">
            </div>
        </div>
        <div class="form-row">
            <div class="field">
                <label>题材（选填）</label>
                <select id="genreInput">
                    <option value="">自动 / 不指定</option>
                    <option value="武侠">武侠</option><option value="都市">都市</option>
                    <option value="科幻">科幻</option><option value="悬疑">悬疑</option>
                    <option value="言情">言情</option><option value="历史">历史</option>
                    <option value="奇幻">奇幻</option><option value="其他">其他</option>
                </select>
            </div>
            <div class="field">
                <label>风格备注（选填）</label>
                <input type="text" id="styleInput" placeholder="如：参考王家卫电影风格">
            </div>
        </div>

        <button class="btn btn-primary" id="convertBtn">✨ 开始转换</button>

        <div id="convertStatus" class="hidden" style="text-align:center;padding:16px;color:var(--sub);">
            <span class="spinner" style="border-color:rgba(123,158,143,0.3);border-top-color:var(--accent);"></span>
            AI 正在分析小说并生成剧本，请稍候…
        </div>
    </div>

    <!-- ── Error Card ── -->
    <div class="card hidden" id="errorCard" style="border-color: var(--danger);">
        <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:24px;">⚠️</span>
            <span style="font-weight:600;" id="errorMsg"></span>
        </div>
        <button class="btn btn-ghost btn-sm" style="margin-top:12px;" id="retryBtn">🔄 返回重试</button>
    </div>

    <!-- ════════════════ 剧本编辑器 ════════════════ -->
    <div class="card hidden" id="editorCard">

        <!-- Toolbar -->
        <div class="editor-toolbar">
            <input type="text" class="editor-title-input" id="editorTitle" placeholder="剧本标题" value="">
            <div class="editor-actions">
                <button class="btn btn-ghost btn-sm" id="editorDownloadBtn">⬇ 下载 YAML</button>
                <button class="btn btn-ghost btn-sm" id="editorBackBtn">🔄 新建转换</button>
            </div>
        </div>

        <!-- Result Meta -->
        <div class="result-meta" id="resultMeta"></div>

        <!-- Editor Tabs -->
        <div class="editor-tabs">
            <button class="editor-tab active" data-panel="structure">🎬 场景结构</button>
            <button class="editor-tab" data-panel="characters">👥 角色列表</button>
            <button class="editor-tab" data-panel="meta">📋 剧本信息</button>
            <button class="editor-tab" data-panel="yaml">📝 YAML 源码</button>
        </div>

        <!-- Tab: 场景结构 -->
        <div class="editor-panel active" id="panelStructure"></div>

        <!-- Tab: 角色列表 -->
        <div class="editor-panel" id="panelCharacters"></div>

        <!-- Tab: 剧本信息 -->
        <div class="editor-panel" id="panelMeta"></div>

        <!-- Tab: YAML 源码 -->
        <div class="editor-panel" id="panelYaml">
            <textarea class="yaml-source" id="yamlSourceTextarea" spellcheck="false" placeholder="YAML 剧本…"></textarea>
            <div style="margin-top: 12px; display: flex; gap: 8px;">
                <button class="btn btn-ghost btn-sm" id="yamlApplyBtn">🔄 应用 YAML 修改到编辑器</button>
                <span style="font-size:12px;color:var(--sub);align-self:center;">
                    在 YAML 面板中直接编辑后点击上方按钮同步到可视化编辑器
                </span>
            </div>
        </div>
    </div>

</div>

<!-- ── Rewrite Modal ── -->
<div class="modal-overlay hidden" id="rewriteModal">
    <div class="modal">
        <div class="modal-header">
            <h3>✨ AI 改写</h3>
            <button class="modal-close" onclick="closeRewriteModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-section">
                <label>原文</label>
                <div class="modal-original" id="rewriteOriginal"></div>
            </div>
            <div class="modal-section">
                <label>改写指令</label>
                <input type="text" class="modal-instruction-input" id="rewriteInstruction"
                    placeholder="例如：更简洁、更悲伤、改成古龙风格、加一个比喻…"
                    onkeydown="if(event.key==='Enter')executeRewrite()">
                <div class="modal-quick-actions" style="margin-top:8px;">
                    <button onclick="quickRewrite('更简洁有力')">🎯 更简洁</button>
                    <button onclick="quickRewrite('更有画面感')">🎥 更有画面感</button>
                    <button onclick="quickRewrite('更富有情感')">💗 更富情感</button>
                    <button onclick="quickRewrite('加入悬念感')">🔮 加入悬念</button>
                    <button onclick="quickRewrite('更符合角色性格')">🎭 更贴性格</button>
                    <button onclick="quickRewrite('更口语化自然')">💬 更口语化</button>
                </div>
            </div>
            <button class="modal-rewrite-btn" id="rewriteExecuteBtn" onclick="executeRewrite()">
                ✨ 开始改写
            </button>
            <div class="hidden" id="rewriteResult">
                <div class="modal-section">
                    <label>改写结果</label>
                    <div class="modal-rewritten" id="rewriteOutput"></div>
                </div>
                <div class="modal-suggestion hidden" id="rewriteSuggestion"></div>
                <div class="modal-result-actions" style="margin-top:12px;">
                    <button class="btn btn-primary" onclick="acceptRewrite()">✅ 采用</button>
                    <button class="btn btn-ghost" onclick="retryRewrite()">🔄 换个写法</button>
                    <button class="btn btn-ghost" onclick="closeRewriteModal()">取消</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ════════════════ State ════════════════
const state = {
    mode: 'text',
    file: null,
    script: null,       // 当前 Script 对象
    rawYaml: null,      // 原始 YAML 文本
    activePanel: 'structure',
    expandedActs: new Set(),
    expandedScenes: new Set(),
    expandedChars: new Set()
};

// ════════════════ DOM refs ════════════════
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// Input
const tabs = $$('.tab');
const textMode = $('#textMode');
const fileMode = $('#fileMode');
const uploadZone = $('#uploadZone');
const fileInput = $('#fileInput');
const fileInfo = $('#fileInfo');
const fileName = $('#fileName');
const removeFile = $('#removeFile');
const contentInput = $('#contentInput');
const wordCount = $('#wordCount');
const titleInput = $('#titleInput');
const authorInput = $('#authorInput');
const genreInput = $('#genreInput');
const styleInput = $('#styleInput');
const convertBtn = $('#convertBtn');
const convertStatus = $('#convertStatus');
const inputCard = $('#inputCard');
const errorCard = $('#errorCard');
const errorMsg = $('#errorMsg');
const retryBtn = $('#retryBtn');
const toast = $('#toast');

// Editor
const editorCard = $('#editorCard');
const editorTitle = $('#editorTitle');
const resultMeta = $('#resultMeta');
const panelStructure = $('#panelStructure');
const panelCharacters = $('#panelCharacters');
const panelMeta = $('#panelMeta');
const panelYaml = $('#panelYaml');
const yamlSourceTextarea = $('#yamlSourceTextarea');
const editorDownloadBtn = $('#editorDownloadBtn');
const editorBackBtn = $('#editorBackBtn');
const yamlApplyBtn = $('#yamlApplyBtn');

// ════════════════ Input: Tab switching ════════════════
tabs.forEach(tab => {
    tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        state.mode = tab.dataset.mode;
        textMode.classList.toggle('hidden', state.mode !== 'text');
        fileMode.classList.toggle('hidden', state.mode !== 'file');
        checkReady();
    });
});

// ════════════════ Input: File Upload ════════════════
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });
removeFile.addEventListener('click', () => {
    state.file = null; fileInput.value = '';
    fileInfo.classList.add('hidden'); uploadZone.classList.remove('hidden');
    checkReady();
});

function handleFile(f) {
    if (!f) return;
    if (!f.name.endsWith('.txt') && f.type !== 'text/plain') { showToast('⚠️ 请选择 .txt 文件'); return; }
    state.file = f;
    fileName.textContent = f.name + ` (${formatSize(f.size)})`;
    uploadZone.classList.add('hidden'); fileInfo.classList.remove('hidden');
    checkReady();
}

function formatSize(bytes) {
    return bytes < 1024 ? bytes + ' B' : bytes < 1048576 ? (bytes / 1024).toFixed(1) + ' KB' : (bytes / 1048576).toFixed(1) + ' MB';
}

// ════════════════ Input: Word Count ════════════════
contentInput.addEventListener('input', () => {
    const len = contentInput.value.length;
    wordCount.textContent = `${len} / 50000 字`;
    wordCount.style.color = len > 50000 ? 'var(--danger)' : 'var(--sub)';
    checkReady();
});

function checkReady() {
    let ready = false;
    if (state.mode === 'text') {
        const len = contentInput.value.trim().length;
        ready = len >= 100 && len <= 50000;
    } else {
        ready = !!state.file;
    }
    convertBtn.disabled = !ready;
}

// ════════════════ Convert ════════════════
convertBtn.addEventListener('click', async () => {
    convertBtn.classList.add('hidden');
    convertStatus.classList.remove('hidden');
    errorCard.classList.add('hidden');
    editorCard.classList.add('hidden');

    try {
        let response;
        if (state.mode === 'text') {
            const body = {
                title: titleInput.value.trim() || undefined,
                author: authorInput.value.trim() || undefined,
                content: contentInput.value,
                genre: genreInput.value || undefined,
                styleNotes: styleInput.value.trim() || undefined
            };
            response = await fetch('/api/convert', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } else {
            const form = new FormData();
            form.append('file', state.file);
            if (titleInput.value.trim()) form.append('title', titleInput.value.trim());
            if (authorInput.value.trim()) form.append('author', authorInput.value.trim());
            if (genreInput.value) form.append('genre', genreInput.value);
            if (styleInput.value.trim()) form.append('styleNotes', styleInput.value.trim());
            response = await fetch('/api/convert/file', { method: 'POST', body: form });
        }

        const data = await response.json();

        if (data.success) {
            loadScriptIntoEditor(data);
        } else {
            showError(data.message || '转换失败，请重试');
        }
    } catch (e) {
        showError('网络请求失败：' + e.message);
    }

    convertBtn.classList.remove('hidden');
    convertStatus.classList.add('hidden');
    checkReady();
});

function showError(msg) {
    inputCard.classList.add('hidden');
    editorCard.classList.add('hidden');
    errorCard.classList.remove('hidden');
    errorMsg.textContent = msg;
    errorCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

retryBtn.addEventListener('click', () => { hideAll(); inputCard.classList.remove('hidden'); });
editorBackBtn.addEventListener('click', () => { hideAll(); inputCard.classList.remove('hidden'); });

function hideAll() {
    inputCard.classList.add('hidden');
    editorCard.classList.add('hidden');
    errorCard.classList.add('hidden');
    convertStatus.classList.add('hidden');
    convertBtn.classList.remove('hidden');
}

// ════════════════ Load Script into Editor ════════════════
function loadScriptIntoEditor(data) {
    state.script = data.script;
    state.rawYaml = data.rawYaml;
    state.expandedActs = new Set();
    state.expandedScenes = new Set();
    state.expandedChars = new Set();

    // auto-expand if only one act
    const acts = state.script?.structure?.acts;
    if (acts && acts.length === 1) {
        state.expandedActs.add(0);
    }

    inputCard.classList.add('hidden');
    errorCard.classList.add('hidden');
    editorCard.classList.remove('hidden');

    // title
    editorTitle.value = state.script?.meta?.title || '未命名剧本';

    // meta tags
    let metaHtml = '';
    if (data.script?.meta?.title) metaHtml += `<span class="tag">📖 ${esc(data.script.meta.title)}</span>`;
    if (data.outputSceneCount) metaHtml += `<span class="tag">🎭 ${data.outputSceneCount} 场</span>`;
    if (data.inputWordCount) metaHtml += `<span class="tag">📝 ${data.inputWordCount} 字</span>`;
    if (data.processingTimeMs) metaHtml += `<span class="tag">⏱ ${(data.processingTimeMs / 1000).toFixed(1)}s</span>`;
    resultMeta.innerHTML = metaHtml;

    switchPanel('structure');
    renderAllPanels();
    editorCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ════════════════ Editor Tabs ════════════════
$$('.editor-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        switchPanel(tab.dataset.panel);
    });
});

function switchPanel(name) {
    state.activePanel = name;
    $$('.editor-tab').forEach(t => t.classList.toggle('active', t.dataset.panel === name));
    $$('.editor-panel').forEach(p => p.classList.toggle('active', p.id === 'panel' + name.charAt(0).toUpperCase() + name.slice(1)));
    renderCurrentPanel();
}

function renderAllPanels() {
    renderMetaPanel();
    renderCharactersPanel();
    renderStructurePanel();
    renderYamlPanel();
}

function renderCurrentPanel() {
    switch (state.activePanel) {
        case 'meta': renderMetaPanel(); break;
        case 'characters': renderCharactersPanel(); break;
        case 'structure': renderStructurePanel(); break;
        case 'yaml': renderYamlPanel(); break;
    }
}

// ════════════════ Title Sync ════════════════
editorTitle.addEventListener('input', () => {
    if (!state.script) return;
    if (!state.script.meta) state.script.meta = {};
    state.script.meta.title = editorTitle.value;
});

// ════════════════ Meta Panel ════════════════
function renderMetaPanel() {
    const m = (state.script && state.script.meta) ? state.script.meta : {};
    ensureMetaDefaults(m);

    panelMeta.innerHTML = `
        <div class="meta-grid">
            <div class="field">
                <label>剧本标题</label>
                <input type="text" value="${esc(m.title || '')}" onchange="updateMeta('title', this.value)">
            </div>
            <div class="field">
                <label>原著标题</label>
                <input type="text" value="${esc(m.originalTitle || '')}" onchange="updateMeta('originalTitle', this.value)">
            </div>
            <div class="field">
                <label>原著作者</label>
                <input type="text" value="${esc(m.originalAuthor || '')}" onchange="updateMeta('originalAuthor', this.value)">
            </div>
            <div class="field">
                <label>版本号</label>
                <input type="text" value="${esc(m.scriptVersion || '1.0.0')}" onchange="updateMeta('scriptVersion', this.value)">
            </div>
            <div class="field">
                <label>题材</label>
                <input type="text" value="${esc(m.genre || '')}" onchange="updateMeta('genre', this.value)">
            </div>
            <div class="field">
                <label>子题材</label>
                <input type="text" value="${esc(m.subGenre || '')}" onchange="updateMeta('subGenre', this.value)">
            </div>
            <div class="field">
                <label>语言</label>
                <input type="text" value="${esc(m.language || 'zh-CN')}" onchange="updateMeta('language', this.value)">
            </div>
            <div class="field">
                <label>源文章节数</label>
                <input type="number" value="${m.sourceChapters || ''}" onchange="updateMeta('sourceChapters', parseInt(this.value)||null)">
            </div>
            <div class="field">
                <label>字数</label>
                <input type="number" value="${m.wordCount || ''}" onchange="updateMeta('wordCount', parseInt(this.value)||null)">
            </div>
            <div class="field">
                <label>创建时间</label>
                <input type="text" value="${esc(m.createdAt || '')}" onchange="updateMeta('createdAt', this.value)">
            </div>
            <div class="field span-2">
                <label>标签</label>
                <div class="tag-list" id="metaTagsList">
                    ${(m.tags || []).map((t, i) => `
                        <span class="tag-item">${esc(t)}<span class="remove" onclick="removeMetaTag(${i})">×</span></span>
                    `).join('')}
                </div>
                <div class="tag-add">
                    <input type="text" id="newMetaTag" placeholder="添加标签…" onkeydown="if(event.key==='Enter')addMetaTag()">
                    <button class="btn btn-ghost btn-sm" onclick="addMetaTag()">+</button>
                </div>
            </div>
            <div class="field span-2">
                <label>备注</label>
                <textarea onchange="updateMeta('notes', this.value)">${esc(m.notes || '')}</textarea>
            </div>
        </div>
    `;
}

function ensureMetaDefaults(m) {
    if (!m.title) m.title = editorTitle.value || '未命名剧本';
    if (!m.scriptVersion) m.scriptVersion = '1.0.0';
    if (!m.language) m.language = 'zh-CN';
    if (!m.tags) m.tags = [];
}

function updateMeta(field, value) {
    if (!state.script) return;
    if (!state.script.meta) state.script.meta = {};
    state.script.meta[field] = value;
    if (field === 'title') editorTitle.value = value || '';
}

function addMetaTag() {
    const input = $('#newMetaTag');
    if (!input) return;
    const val = input.value.trim();
    if (!val) return;
    if (!state.script.meta) state.script.meta = {};
    if (!state.script.meta.tags) state.script.meta.tags = [];
    state.script.meta.tags.push(val);
    input.value = '';
    renderMetaPanel();
}

function removeMetaTag(index) {
    if (!state.script.meta || !state.script.meta.tags) return;
    state.script.meta.tags.splice(index, 1);
    renderMetaPanel();
}

// ════════════════ Characters Panel ════════════════
function renderCharactersPanel() {
    const chars = (state.script && state.script.characters) ? state.script.characters : [];

    panelCharacters.innerHTML = `
        <div class="char-grid">
            ${chars.map((ch, i) => renderCharCard(ch, i)).join('')}
        </div>
        <button class="add-char-btn" onclick="addCharacter()">＋ 添加角色</button>
    `;

    // restore expanded state
    state.expandedChars.forEach(i => {
        const card = panelCharacters.querySelector(`.char-card[data-char-index="${i}"]`);
        if (card) card.classList.add('expanded');
    });
}

function renderCharCard(ch, index) {
    const roleLabels = { protagonist: '主角', antagonist: '反派', supporting: '配角', minor: '次要', cameo: '客串' };
    const roleBadge = roleLabels[ch.role] || ch.role || '未设定';
    const isExpanded = state.expandedChars.has(index);
    const charId = ch.id || `char_${String(index + 1).padStart(3, '0')}`;

    return `
        <div class="char-card ${isExpanded ? 'expanded' : ''}" data-char-index="${index}">
            <div class="char-card-header" onclick="toggleCharCard(${index})">
                <span class="char-name">${esc(ch.name || '未命名角色')}</span>
                <span class="char-role-badge">${esc(roleBadge)}</span>
            </div>
            <div class="char-card-body">
                <div class="char-field">
                    <label>角色 ID</label>
                    <input type="text" value="${esc(charId)}" onchange="updateChar(${index},'id',this.value)">
                </div>
                <div class="char-field">
                    <label>姓名</label>
                    <input type="text" value="${esc(ch.name || '')}" onchange="updateChar(${index},'name',this.value)">
                </div>
                <div class="char-field">
                    <label>别名（逗号分隔）</label>
                    <input type="text" value="${esc((ch.alias || []).join(', '))}" onchange="updateCharAlias(${index}, this.value)">
                </div>
                <div class="char-field">
                    <label>角色定位</label>
                    <select onchange="updateChar(${index},'role',this.value)">
                        ${['protagonist','antagonist','supporting','minor','cameo'].map(r =>
                            `<option value="${r}" ${ch.role === r ? 'selected' : ''}>${roleLabels[r] || r}</option>`
                        ).join('')}
                        ${!['protagonist','antagonist','supporting','minor','cameo'].includes(ch.role) && ch.role ? `<option value="${esc(ch.role)}" selected>${esc(ch.role)}</option>` : ''}
                    </select>
                </div>
                <div class="char-field">
                    <label>角色原型</label>
                    <input type="text" value="${esc(ch.archetype || '')}" onchange="updateChar(${index},'archetype',this.value)">
                </div>
                <div class="char-field">
                    <label>性别</label>
                    <select onchange="updateChar(${index},'gender',this.value)">
                        <option value="">未设定</option>
                        <option value="男" ${ch.gender === '男' ? 'selected' : ''}>男</option>

// 简易 YAML 序列化器（用于预览；下载时调用后端确保精确格式）
function scriptToYaml(script) {
    const lines = [];
    lines.push('script:');
    pushObj(script, lines, 1);
    return lines.join('\n');

    function pushObj(obj, lines, indent) {
        if (obj === null || obj === undefined) return;
        const pad = '  '.repeat(indent);
        const keys = Object.keys(obj);

        // 按 property order 排序
        const order = ['meta','characters','structure','revision_history'];
        keys.sort((a,b) => {
            const ai = order.indexOf(a), bi = order.indexOf(b);
            return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        });

        for (const key of keys) {
            const val = obj[key];
            if (val === null || val === undefined) continue;
            const yamlKey = key.replace(/([A-Z])/g, '_$1').toLowerCase();

            if (Array.isArray(val)) {
                if (val.length === 0) {
                    lines.push(`${pad}${yamlKey}: []`);
                } else if (typeof val[0] === 'object' && val[0] !== null) {
                    lines.push(`${pad}${yamlKey}:`);
                    for (const item of val) {
                        lines.push(`${pad}- `);
                        pushObj(item, lines, indent + 2);
                    }
                } else {
                    lines.push(`${pad}${yamlKey}: [${val.map(v => typeof v === 'string' ? `"${escapeYamlStr(v)}"` : v).join(', ')}]`);
                }
            } else if (typeof val === 'object') {
                lines.push(`${pad}${yamlKey}:`);
                pushObj(val, lines, indent + 1);
            } else if (typeof val === 'string') {
                if (val.includes('\n')) {
                    lines.push(`${pad}${yamlKey}: |`);
                    for (const line of val.split('\n')) {
                        lines.push(`${pad}  ${line}`);
                    }
                } else {
                    lines.push(`${pad}${yamlKey}: ${escapeYamlVal(val)}`);
                }
            } else if (typeof val === 'number') {
                lines.push(`${pad}${yamlKey}: ${val}`);
            } else if (typeof val === 'boolean') {
                lines.push(`${pad}${yamlKey}: ${val}`);
            }
        }
    }

    function escapeYamlStr(s) {
        return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
    }

    function escapeYamlVal(s) {
        if (!s) return '""';
        if (/[:\{\}\[\],&\*\?!\|>'"@`#\n]/.test(s) || s.startsWith(' ') || s.endsWith(' ') || /^\d/.test(s)) {
            return `"${escapeYamlStr(s)}"`;
        }
        return s;
    }
}

// ════════════════ Download ════════════════
editorDownloadBtn.addEventListener('click', async () => {
    if (!state.script) return;
    try {
        const response = await fetch('/api/script/serialize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(state.script)
        });
        if (!response.ok) throw new Error('序列化失败');
        const yaml = await response.text();
        const blob = new Blob([yaml], { type: 'application/x-yaml;charset=UTF-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (state.script.meta?.title || 'script') + '.yaml';
        a.click();
        URL.revokeObjectURL(url);
        showToast('✅ YAML 已下载');
    } catch (e) {
        // 回退：使用前端序列化
        try {
            const yaml = scriptToYaml(state.script);
            const blob = new Blob([yaml], { type: 'application/x-yaml;charset=UTF-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (state.script.meta?.title || 'script') + '.yaml';
            a.click();
            URL.revokeObjectURL(url);
            showToast('✅ YAML 已下载（前端序列化）');
        } catch (e2) {
            showToast('❌ 下载失败: ' + e2.message);
        }
    }
});

// ════════════════ AI Rewrite ════════════════
const rewriteModal = $('#rewriteModal');
const rewriteOriginal = $('#rewriteOriginal');
const rewriteInstruction = $('#rewriteInstruction');
const rewriteExecuteBtn = $('#rewriteExecuteBtn');
const rewriteResult = $('#rewriteResult');
const rewriteOutput = $('#rewriteOutput');
const rewriteSuggestion = $('#rewriteSuggestion');

state.rewriteContext = null; // { actIndex, sceneIndex, blockIndex, originalText, ... }

function openRewriteModal(actIndex, sceneIndex, blockIndex) {
    const scene = state.script.structure.acts[actIndex].scenes[sceneIndex];
    const block = scene.content[blockIndex];

    // 获取角色信息（如果是对话）
    let charName = block.characterName || '';
    let charPersonality = '';
    if (block.character) {
        const ch = (state.script.characters || []).find(c => c.id === block.character);
        if (ch) {
            charName = charName || ch.name;
            charPersonality = (ch.personality || []).join('，');
        }
    }

    // 获取前后文（相邻内容块）
    const surrounding = scene.content
        .filter((_, i) => Math.abs(i - blockIndex) <= 2 && i !== blockIndex)
        .map(b => {
            const prefix = b.type === 'dialogue' && b.characterName ? `[${b.characterName}]: ` : '';
            return prefix + (b.text || '');
        })
        .join('\n');

    state.rewriteContext = {
        actIndex, sceneIndex, blockIndex,
        originalText: block.text || '',
        blockType: block.type || 'action',
        sceneTitle: scene.sceneTitle || '',
        sceneLocation: scene.location || '',
        sceneTime: scene.time || '',
        sceneMood: scene.mood || '',
        characterName: charName,
        characterPersonality: charPersonality,
        surroundingText: surrounding
    };

    // 渲染原文
    const typeLabels = { action: '动作', dialogue: '对话', transition: '转场', note: '备注' };
    rewriteOriginal.innerHTML = `<span class="type-label">${typeLabels[block.type] || block.type}</span>${esc(block.text || '(空)')}`;

    // 重置状态
    rewriteInstruction.value = '';
    rewriteResult.classList.add('hidden');
    rewriteExecuteBtn.classList.remove('hidden');
    rewriteExecuteBtn.disabled = false;
    rewriteExecuteBtn.innerHTML = '✨ 开始改写';

    rewriteModal.classList.remove('hidden');
    rewriteInstruction.focus();
}

function closeRewriteModal() {
    rewriteModal.classList.add('hidden');
    state.rewriteContext = null;
}

function quickRewrite(instruction) {
    rewriteInstruction.value = instruction;
    executeRewrite();
}

async function executeRewrite() {
    const ctx = state.rewriteContext;
    if (!ctx) return;

    const instruction = rewriteInstruction.value.trim();
    if (!instruction) {
        rewriteInstruction.focus();
        return;
    }

    // 显示加载
    rewriteExecuteBtn.disabled = true;
    rewriteExecuteBtn.innerHTML = '<span class="spinner" style="border-color:rgba(255,255,255,0.3);border-top-color:#fff;"></span> AI 正在改写…';
    rewriteResult.classList.add('hidden');

    try {
        const response = await fetch('/api/rewrite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                originalText: ctx.originalText,
                blockType: ctx.blockType,
                instruction: instruction,
                sceneTitle: ctx.sceneTitle,
                sceneLocation: ctx.sceneLocation,
                sceneTime: ctx.sceneTime,
                sceneMood: ctx.sceneMood,
                characterName: ctx.characterName,
                characterPersonality: ctx.characterPersonality,
                surroundingText: ctx.surroundingText
            })
        });

        const data = await response.json();

        if (data.success) {
            rewriteOutput.textContent = data.rewrittenText;
            if (data.suggestion) {
                rewriteSuggestion.textContent = '💡 ' + data.suggestion;
                rewriteSuggestion.classList.remove('hidden');
            } else {
                rewriteSuggestion.classList.add('hidden');
            }
            rewriteResult.classList.remove('hidden');
            rewriteExecuteBtn.classList.add('hidden');
        } else {
            showToast('❌ ' + (data.message || '改写失败'));
            rewriteExecuteBtn.disabled = false;
            rewriteExecuteBtn.innerHTML = '✨ 开始改写';
        }
    } catch (e) {
        showToast('❌ 网络请求失败: ' + e.message);
        rewriteExecuteBtn.disabled = false;
        rewriteExecuteBtn.innerHTML = '✨ 开始改写';
    }
}

function acceptRewrite() {
    const ctx = state.rewriteContext;
    if (!ctx) return;

    const newText = rewriteOutput.textContent;
    if (newText) {
        state.script.structure.acts[ctx.actIndex].scenes[ctx.sceneIndex].content[ctx.blockIndex].text = newText;
        renderStructurePanel();
        showToast('✅ 已应用改写');
    }
    closeRewriteModal();
}

function retryRewrite() {
    rewriteResult.classList.add('hidden');
    rewriteExecuteBtn.classList.remove('hidden');
    rewriteExecuteBtn.disabled = false;
    rewriteExecuteBtn.innerHTML = '✨ 开始改写';
}

// 点击 modal 遮罩关闭
rewriteModal.addEventListener('click', function(e) {
    if (e.target === rewriteModal) closeRewriteModal();
});

// ════════════════ Toast ════════════════
function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
}

// ════════════════ Helpers ════════════════
function esc(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════ Theme ════════════════
const themeToggle = $('#themeToggle');
const THEME_KEY = 'app-theme';

function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
}

themeToggle.addEventListener('click', () => {
    const next = (document.documentElement.getAttribute('data-theme') || 'light') === 'dark' ? 'light' : 'dark';
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
});

(function loadTheme() {
    applyTheme(localStorage.getItem(THEME_KEY) || 'light');
})();

// init
checkReady();
</script>
